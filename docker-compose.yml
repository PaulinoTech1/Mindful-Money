# Local development and test infrastructure ONLY.
# Not used in production -- production Postgres is provisioned and
# hardened separately per deploy/DEPLOYMENT.md (dedicated roles,
# pg_hba.conf, TLS, no exposed port). This file exists purely so a
# developer machine (this one has no native Postgres) can run the app
# and its test suite.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault_dev_only_password
      POSTGRES_DB: vault_dev
    ports:
      - "5432:5432"
    volumes:
      - vault_pg_data:/var/lib/postgresql/data
      - ./deploy/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vault_pg_data:
