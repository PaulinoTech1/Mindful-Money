[package]
name = "manual_expense"
type = "bin"
authors = [""]
# Nargo rejects prerelease versions in `compiler_version` (it accepts
# full releases only), so beta.26 cannot be expressed in this manifest.
# The toolchain is instead pinned and checked by scripts/build_zkp.sh.

[dependencies]
# Derived from upstream tag v0.2.6 with the beta.26 compatibility patch
# documented in the vendored package README.
poseidon = { path = "../vendor/poseidon-v0.2.6-beta26" }
