name: PR Verification

# Runs on pull requests without deployment credentials.
# Verifies code changes before merge. The deploy workflow runs separately
# on main and has GCP deployment authority.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_test_password
          POSTGRES_DB: vault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Security audit production dependencies
        run: |
          pip-audit --desc --require-hashes --disable-pip -r requirements-hashed.txt

      - name: Wait for PostgreSQL
        run: |
          python3 -c "
          import time, socket
          for i in range(30):
              try:
                  s = socket.create_connection(('localhost', 5432), timeout=2)
                  s.close()
                  print('PostgreSQL ready')
                  break
              except:
                  time.sleep(1)
          "

      - name: KDF no-fallback unit test (JS)
        run: |
          node tests/kdf_no_fallback.test.mjs
          node tests/padding.test.mjs
          node tests/upload_chunking.test.mjs
          node tests/record_shape.test.mjs
          node tests/demo_dataset.test.mjs
          node tests/professional_copy.test.mjs

      - name: Run full test suite
        run: |
          python -m pytest test_demo.py test_zkp_server.py test_db_error_logging.py test_kdf_migrate_and_limits.py test_recovery_rekey.py test_integrity_script.py -v --tb=short --no-header -rA
        env:
          VAULT_ENV: test
          VAULT_TEST_DATABASE_URL: postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_test

      - name: Verify migration chain
        run: |
          python3 << 'PYEOF'
          import os, re, sys
          versions_dir = 'migrations/versions'
          revisions = {}
          for f in sorted(os.listdir(versions_dir)):
              if f.endswith('.py'):
                  with open(os.path.join(versions_dir, f)) as fp:
                      content = fp.read()
                      rev = re.search(r'^revision:\s*str\s*=\s*["\']([^"\']+)["\']', content, re.M)
                      down = re.search(r'^down_revision.*=[\s]*["\']([^"\']+)["\']', content, re.M)
                      if rev:
                          revisions[rev.group(1)] = down.group(1) if down else None
          errors = sum(1 for rev, down in revisions.items() if down and down not in revisions)
          if errors:
              print(f"FAILED: {errors} broken migration references")
              sys.exit(1)
          print("Migration chain OK")
          PYEOF

      - name: Schema drift check (models vs migrations)
        run: |
          # Fresh DB, upgrade head, then autogenerate compare with types and
          # server defaults; any diff fails the job (bugs O and R).
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d postgres -c "DROP DATABASE IF EXISTS vault_drift_check;"
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d postgres -c "CREATE DATABASE vault_drift_check OWNER vault;"
          export VAULT_ENV=test VAULT_DATABASE_URL="postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_drift_check"
          alembic upgrade head
          test "$(alembic current 2>/dev/null | awk '{print $1}')" = "$(alembic heads 2>/dev/null | awk '{print $1}')"
          python scripts/check_schema_drift.py

  browser-test:
    runs-on: ubuntu-latest
    needs: verify
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_test_password
          POSTGRES_DB: vault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install playwright==1.63.0  # pinned: test_browser.py targets this API (data=, not json=)
          python -m playwright install chromium --with-deps

      - name: Run browser E2E tests
        run: |
          set -euo pipefail
          python test_browser.py --headless
          python test_playwright_recovery.py
        env:
          VAULT_ENV: test
          VAULT_TEST_DATABASE_URL: postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_test

  zkp-v4:
    # Circuit tests, rebuild-equals-committed check, real bb prove/verify
    # (honest verifies, random-key proof rejected), browser client test.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pinned ZK runtime (bb, CRS)
        id: zkp-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zkp
          key: zkp-runtime-${{ hashFiles('scripts/fetch_zkp_runtime.py', 'zkp/manual_expense_v4/target/vk') }}

      - name: Fetch bb and CRS (sha256 pinned)
        if: steps.zkp-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_zkp_runtime.py "$RUNNER_TEMP/zkp" zkp/manual_expense_v4/target

      - name: Install nargo 1.0.0-beta.26 (sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/nargo.tgz" https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.26/nargo-x86_64-unknown-linux-gnu.tar.gz
          echo "64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80  $RUNNER_TEMP/nargo.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/nargo.tgz" -C "$RUNNER_TEMP/bin" nargo
          cp "$RUNNER_TEMP/zkp/bb" "$RUNNER_TEMP/bin/bb"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Circuit tests and bb end-to-end
        run: |
          cp -r "$RUNNER_TEMP/zkp/crs" "$RUNNER_TEMP/crs-work"
          ZKP_CRS_DIR="$RUNNER_TEMP/crs-work" scripts/zkp_v4_e2e.sh
          git diff --exit-code zkp/

      - name: Real bb verification of the committed fixture
        run: python -m unittest -v test_zkp_real_bb
        env:
          ZKP_REQUIRE_REAL: '1'
          ZKP_BB_EXECUTABLE: ${{ runner.temp }}/zkp/bb
          ZKP_CRS_DIR: ${{ runner.temp }}/zkp/crs
          ZKP_V4_VK_PATH: zkp/manual_expense_v4/target/vk

      - name: Browser client test (Node, real circuit)
        working-directory: static/zkp
        run: |
          npm ci --no-audit --no-fund
          npm run test:v4

      - name: Lazy prover bundle is reproducible (rebuild equals committed)
        working-directory: static/zkp
        run: |
          npm run build:browser
          git diff --exit-code -- build/

  browser-zkp-v4:
    # Real browser + real bb verifier: enroll, prove, store, decrypt,
    # fallbacks, recovery rekey, network capture, proving-time numbers.
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_test_password
          POSTGRES_DB: vault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install chromium --with-deps

      - name: Cache pinned ZK runtime (bb, CRS)
        id: zkp-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zkp
          key: zkp-runtime-${{ hashFiles('scripts/fetch_zkp_runtime.py', 'zkp/manual_expense_v4/target/vk') }}

      - name: Fetch bb and CRS (sha256 pinned)
        if: steps.zkp-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_zkp_runtime.py "$RUNNER_TEMP/zkp" zkp/manual_expense_v4/target

      - name: ZKP v4 UI end-to-end (headless Chromium)
        run: |
          python test_playwright_zkp_v4.py
          { echo '### Browser proving time (CI runner, headless Chromium)'; echo '```'; cat "$RUNNER_TEMP/zkp_timings.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          VAULT_ENV: test
          VAULT_TEST_DATABASE_URL: postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_test
          ZKP_BB_EXECUTABLE: ${{ runner.temp }}/zkp/bb
          ZKP_CRS_DIR: ${{ runner.temp }}/zkp/crs
          ZKP_V4_VK_PATH: zkp/manual_expense_v4/target/vk
          ZKP_TIMINGS_OUT: ${{ runner.temp }}/zkp_timings.json

  docker-zkp:
    # Builds the production image (pinned downloads checked during build),
    # verifies the fixture proof INSIDE it with no network, and reports the
    # image size against main.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR image
        run: docker build -t mm:pr .

      - name: Verify fixture inside the image with --network none
        run: |
          docker run --rm --network none \
            -e ZKP_REQUIRE_REAL=1 \
            -v "$PWD/tests/fixtures:/home/appuser/app/tests/fixtures:ro" \
            -v "$PWD/test_zkp_real_bb.py:/home/appuser/app/test_zkp_real_bb.py:ro" \
            mm:pr python -m unittest -v test_zkp_real_bb

      - name: Image size versus main
        run: |
          git worktree add "$RUNNER_TEMP/base" origin/main
          docker build -q -t mm:base "$RUNNER_TEMP/base" >/dev/null
          pr=$(docker image inspect mm:pr --format '{{.Size}}')
          base=$(docker image inspect mm:base --format '{{.Size}}')
          echo "image size: main=$base bytes, pr=$pr bytes, delta=$((pr - base)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
