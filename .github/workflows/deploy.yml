name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'db.py'
      - 'models.py'
      - 'zkp_verifier.py'
      - 'static/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-c89a7f58-b865-4112-bf8
  REGION: us-central1
  SERVICE_NAME: mindful-money
  REPO_NAME: mindful-money

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region ${{ env.REGION }} \
            --set-env-vars "VAULT_ENV=production,VAULT_AUTH_POLICY=required,VAULT_RP_ID=mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_ORIGIN=https://mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_TRUST_PROXY=1,VAULT_CSP_MODE=enforce" \
            --set-secrets "VAULT_SECRET_KEY=mindful-money-secret:latest,VAULT_DATABASE_URL=neon-db-url:latest" \
            --quiet
