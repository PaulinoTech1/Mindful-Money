name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'db.py'
      - 'models.py'
      - 'zkp_verifier.py'
      - 'static/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-c89a7f58-b865-4112-bf8
  REGION: us-central1
  SERVICE_NAME: mindful-money
  REPO_NAME: mindful-money

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest test_demo.py -x -q
        env:
          VAULT_ENV: test

      - name: Check migrations
        run: |
          # Verify migration chain is valid (no broken revises/down_revision)
          python -c "
          import os
          versions_dir = 'migrations/versions'
          revisions = {}
          for f in os.listdir(versions_dir):
              if f.endswith('.py'):
                  with open(os.path.join(versions_dir, f)) as fp:
                      content = fp.read()
                      # Extract revision and down_revision
                      import re
                      rev = re.search(r'^revision:\s*str\s*=\s*[\"\']([^\"\']+)[\"\']', content, re.M)
                      down = re.search(r'^down_revision.*=[\s]*[\"\']([^\"\']+)[\"\']', content, re.M)
                      if rev:
                          revisions[rev.group(1)] = down.group(1) if down else None
          # Check chain integrity
          seen = set()
          for rev, down in revisions.items():
              if down and down != 'None' and down not in revisions:
                  print(f'BROKEN: {rev} references missing {down}')
                  exit(1)
          print(f'Migration chain OK: {len(revisions)} revisions')
          "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --set-env-vars "VAULT_ENV=production,VAULT_AUTH_POLICY=required,VAULT_RP_ID=mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_ORIGIN=https://mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_TRUST_PROXY=1,VAULT_CSP_MODE=enforce" \
            --set-secrets "VAULT_SECRET_KEY=mindful-money-secret:latest,VAULT_DATABASE_URL=neon-db-url:latest" \
            --quiet
