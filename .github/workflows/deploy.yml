name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'db.py'
      - 'models.py'
      - 'zkp_verifier.py'
      - 'static/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'requirements-hashed.txt'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-c89a7f58-b865-4112-bf8
  REGION: us-central1
  SERVICE_NAME: mindful-money
  REPO_NAME: mindful-money

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_test_password
          POSTGRES_DB: vault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Security audit production dependencies
        run: |
          echo "=== Auditing production dependencies (blocks on vulnerabilities) ==="
          # Audit the exact pinned, hash-locked set the Dockerfile installs.
          # --disable-pip: the file is fully pinned with hashes, so no resolver
          # or throwaway venv is needed. pytest and other dev tools are in
          # requirements-dev.txt and do not ship to Cloud Run.
          pip-audit --desc --require-hashes --disable-pip -r requirements-hashed.txt 2>&1
          echo "=== Production dependency audit passed ==="

      - name: Security audit dev dependencies (informational)
        run: |
          echo "=== Auditing dev dependencies (informational only) ==="
          pip-audit --desc -r requirements-dev.txt 2>&1 || echo "Dev dependency issues noted (non-blocking)"

      - name: Wait for PostgreSQL
        run: |
          python3 -c "
          import time, socket
          for i in range(30):
              try:
                  s = socket.create_connection(('localhost', 5432), timeout=2)
                  s.close()
                  print('PostgreSQL is ready')
                  break
              except:
                  print(f'Waiting for PostgreSQL... {i+1}')
                  time.sleep(2)
          else:
              raise Exception('PostgreSQL not ready')
          "

      - name: Run tests
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== Installed packages ==="
          pip list | grep -i -E "pytest|nacl|flask|sqlalchemy|psycopg|webauthn"
          echo "=== Running tests with full verbose output ==="
          # Full regression suite: authentication, tenant isolation, privacy,
          # cryptography, and lifecycle tests. All 88 tests must pass.
          # See: docs/POST_MORTEM_STALE_DEPLOY.md for history.
          python -m pytest test_demo.py test_zkp_server.py test_db_error_logging.py test_kdf_migrate_and_limits.py -v --tb=short --no-header -rA 2>&1
          echo "=== Test exit code: $? ==="
        env:
          VAULT_ENV: test
          VAULT_TEST_DATABASE_URL: postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_test

      - name: Check migrations
        run: |
          echo "=== Checking migration chain integrity ==="
          python3 << 'PYEOF'
          import os, re, sys
          versions_dir = 'migrations/versions'
          revisions = {}
          print(f"Scanning {versions_dir}/...")
          for f in sorted(os.listdir(versions_dir)):
              if f.endswith('.py'):
                  path = os.path.join(versions_dir, f)
                  with open(path) as fp:
                      content = fp.read()
                      rev = re.search(r'^revision:\s*str\s*=\s*["\']([^"\']+)["\']', content, re.M)
                      down = re.search(r'^down_revision.*=[\s]*["\']([^"\']+)["\']', content, re.M)
                      if rev:
                          rev_id = rev.group(1)
                          down_id = down.group(1) if down else None
                          revisions[rev_id] = down_id
                          print(f"  {f}: revision={rev_id}, down_revision={down_id}")
                      else:
                          print(f"  WARNING: {f} has no revision ID")
          print(f"\nFound {len(revisions)} revisions")
          # Check chain integrity
          errors = 0
          for rev, down in revisions.items():
              if down and down not in revisions:
                  print(f"  BROKEN: {rev} references missing down_revision {down}")
                  errors += 1
          if errors:
              print(f"\nFAILED: {errors} broken migration references")
              sys.exit(1)
          print("\nMigration chain OK")
          PYEOF
          echo "=== Migration check exit code: $? ==="

      - name: Test migrations on fresh database
        run: |
          echo "=== Testing alembic upgrade head on fresh database ==="
          # Create a fresh test database for migration testing
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d postgres -c "DROP DATABASE IF EXISTS vault_migrate_test;" 2>&1
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d postgres -c "CREATE DATABASE vault_migrate_test OWNER vault;" 2>&1
          # Run all migrations
          # Note: migrations/env.py reads VAULT_DATABASE_URL (not VAULT_TEST_DATABASE_URL)
          VAULT_ENV=test VAULT_DATABASE_URL="postgresql+psycopg://vault:vault_test_password@localhost:5432/vault_migrate_test" alembic upgrade head 2>&1
          echo "=== Migration test exit code: $? ==="
          # Verify expected tables exist after migration
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d vault_migrate_test -c "\dt" 2>&1 | grep -q "audit_events" || (echo "FAILED: audit_events table missing after migration" && exit 1)
          PGPASSWORD=vault_test_password psql -h localhost -U vault -d vault_migrate_test -c "\dt" 2>&1 | grep -q "records" || (echo "FAILED: records table missing after migration" && exit 1)
          echo "=== Migration schema verified ==="

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/app:${{ github.sha }}"
          # Note: --no-cache ensures fresh builds but does not improve reproducibility.
          # For stronger supply-chain assurance: pin base image by digest,
          # pin all Python dependencies with hashes, and use verified build provenance.
          docker build --no-cache \
            --build-arg GITHUB_SHA="${{ github.sha }}" \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --update-env-vars "VAULT_ENV=production,VAULT_AUTH_POLICY=required,VAULT_RP_ID=mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_ORIGIN=https://mindful-money-k23ukkh5cq-uc.a.run.app,VAULT_TRUST_PROXY=1,VAULT_CSP_MODE=enforce" \
            --max-instances 3 \
            --concurrency 8 \
            --update-secrets "VAULT_SECRET_KEY=mindful-money-secret:latest,VAULT_DATABASE_URL=neon-db-url:latest" \
            --quiet

      - name: Post-deploy smoke tests
        run: |
          echo "=== Waiting for deployment to stabilize ==="
          sleep 30
          
          # Canonical host: the only one matching VAULT_RP_ID / VAULT_ORIGIN.
          BASE_URL="https://mindful-money-k23ukkh5cq-uc.a.run.app"
          EXPECTED_SHA="${{ github.sha }}"
          EXPECTED_SHORT=$(echo "$EXPECTED_SHA" | cut -c1-12)
          
          echo "=== Checking /health ==="
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health")
          if [ "$HEALTH_CODE" != "200" ]; then
            echo "FAILED: /health returned $HEALTH_CODE"
            exit 1
          fi
          echo "Health check passed"

          echo "=== Checking /ready (database reachable) ==="
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/ready")
          if [ "$READY_CODE" != "200" ]; then
            echo "FAILED: /ready returned $READY_CODE (database unreachable from the new revision)"
            exit 1
          fi
          echo "Readiness check passed"
          
          echo "=== Checking /api/version ==="
          VERSION=$(curl -s "$BASE_URL/api/version")
          DEPLOYED_SHA=$(echo "$VERSION" | python3 -c "import sys, json; print(json.load(sys.stdin).get('commit', 'unknown'))")
          echo "Expected: $EXPECTED_SHORT"
          echo "Deployed: $DEPLOYED_SHA"
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHORT" ]; then
            echo "FAILED: Deployed commit does not match expected (stale deployment!)"
            exit 1
          fi
          echo "Version check passed"
          
          echo "=== Checking /api/passkeys/status ==="
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/passkeys/status")
          if [ "$STATUS_CODE" = "404" ] || [ "$STATUS_CODE" = "500" ]; then
            echo "FAILED: /api/passkeys/status returned $STATUS_CODE"
            exit 1
          fi
          echo "API status check passed"

          echo "=== Verifying JS integrity ==="
          # Fetch the integrity manifest and verify served JS matches.
          # This detects stale deployments or tampered JavaScript.
          # Fails the deploy on mismatch.
          MANIFEST_URL="$BASE_URL/static/integrity-manifest.json"
          MANIFEST=$(curl -s -f "$MANIFEST_URL") || {
            echo "FAILED: Could not fetch integrity manifest from $MANIFEST_URL"
            exit 1
          }
          for JS_FILE in "app.js" "simplefin-client.js" "recovery-words.js"; do
            EXPECTED=$(echo "$MANIFEST" | python3 -c "import sys, json; print(json.load(sys.stdin).get('files', {}).get('$JS_FILE', {}).get('sha256', 'MISSING'))")
            if [ "$EXPECTED" = "MISSING" ]; then
              echo "WARNING: $JS_FILE not in manifest, skipping"
              continue
            fi
            ACTUAL=$(curl -s -f "$BASE_URL/static/$JS_FILE" | sha256sum | cut -d' ' -f1) || {
              echo "FAILED: Could not fetch $JS_FILE"
              exit 1
            }
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "FAILED: $JS_FILE hash mismatch (served JS differs from committed manifest)"
              echo "  expected: $EXPECTED"
              echo "  actual:   $ACTUAL"
              echo "  This may indicate a stale deployment or tampered JavaScript."
              exit 1
            fi
            echo "  $JS_FILE: hash verified"
          done
          echo "JS integrity check passed"
          
          echo "=== All smoke tests passed ==="
