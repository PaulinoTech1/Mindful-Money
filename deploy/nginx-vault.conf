# Replace vault.example.com and certificate paths before installation.
limit_req_zone $binary_remote_addr zone=vault_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vault_passkeys:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vault_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vault.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 8m;
    client_body_timeout 15s;
    limit_conn vault_connections 20;
    limit_req zone=vault_general burst=30 nodelay;

    location ~ (^|/)\. { return 404; }
    location ~* \.(?:db|db-wal|db-shm|db-journal|env|py|pyc|pyo|service|conf)$ { return 404; }
    location ~ ^/(?:tests?|deploy|instance|__pycache__)(?:/|$) { return 404; }

    location ^~ /api/passkeys/ {
        limit_req zone=vault_passkeys burst=10 nodelay;
        proxy_pass http://unix:/run/vault/vault.sock:;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://unix:/run/vault/vault.sock:;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
